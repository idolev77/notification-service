# ---------------------------------------------------------------------------
# Alembic configuration.
# DB URL is NOT set here — it is injected at runtime from `app.core.config`
# (see `alembic/env.py`). This keeps secrets out of source control.
# ---------------------------------------------------------------------------

[alembic]
script_location = alembic
prepend_sys_path = .
# `sqlalchemy.url` deliberately omitted; env.py reads `Settings().database_url`.

# Use timestamped, slug-prefixed filenames so migrations sort chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# ---------------------------------------------------------------------------
# Logging — kept minimal; the app uses structlog at runtime.
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
